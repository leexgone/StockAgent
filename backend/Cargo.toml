[workspace]
members = ["crates/zimu-server", "crates/zimu-agent-cli", "crates/zimu-domain", "crates/zimu-store", "crates/zimu-market"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"

# 共同演进（P2-T5 演练，见 docs/06-roadmap.md）：robit 全家 pin 到 v0.1.26 tag
# （robit-web 随该版首发；升级 pin 前先想 robit 那边的节奏，约定见 CLAUDE.md）。
# tag 尚未推送远端/crates.io，暂以 file:// 指向本地 robit 仓库完成回路验证；
# 正式发布后换回 crates.io 写法：robit-ai = "0.1.26" 等。
[workspace.dependencies]
robit-ai = { git = "file:///E:/Github/robit", tag = "v0.1.26" }
robit-agent = { git = "file:///E:/Github/robit", tag = "v0.1.26" }
robit-web = { git = "file:///E:/Github/robit", tag = "v0.1.26" }
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",     # mpsc / oneshot（Agent 通道）
    "io-std",   # stdin（REPL）
    "io-util",  # AsyncBufReadExt
    "time",     # 探测超时（P4-T4：status 端点有界降级；此前经 reqwest 间接启用，显式声明）
] }
async-trait = "0.1"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] } # BroadcastStream（SSE 事件扇出）
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
# P4-T2 存储：bundled 自带 SQLite 编译，不依赖系统库。
# 版本必须与 robit-agent 的 rusqlite 对齐（0.40）：libsqlite3-sys 的 links
# 约束全依赖图只允许一份 libsqlite3，不同主版本会直接解析冲突。
rusqlite = { version = "0.40", features = ["bundled"] }
# P4-T4 行情适配器：版本与特性跟 robit 侧的 reqwest 对齐（0.13，default-features
# 关）——同一份已编译依赖，不引入 native-tls 等新增重量。0.13 起 query() 在
# 独立 feature 里（serde_urlencoded，robit 已启用，零新增编译单元）。
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
# P4-T4 市场时钟：只用固定偏移（Asia/Shanghai = UTC+8，03 §9 生产口径），
# 不引时区数据库；clock 特性提供 Utc::now。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
