[workspace]
members = ["crates/zimu-server", "crates/zimu-agent-cli", "crates/zimu-domain", "crates/zimu-store", "crates/zimu-market", "crates/zimu-agent"]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"

# 共同演进（P2-T5 回路，见 docs/06-roadmap.md）：robit 全家消费 crates.io 正式版。
# 0.6.0（2026-11-23）= Bot 忙碌状态信号（typing）统一抽象 + PlatformCaps 一次性
# 破坏加固（设计件 robit/docs/robit-rfc-bot-typing-design.md，W-D 终态/路径 B）：
# chatbot 层 typing 钩子（trait 新方法带默认 no-op 实现，运行时行为零变化，
# 无平台启用）+ PlatformCaps #[non_exhaustive] + Default（保守基线）——crate 外
# 结构体字面量构造一次性编译失败，迁移为 default() + 字段覆写，此后增补能力
# 字段永久非破坏。微信 typing 实际实现依赖上游 weixin-agent 0.4.0（SDK PR #4），
# robit feat/wechat-typing 分支等上游发版后合并，不含在本版（R13⑦ 框架侧落地、
# 实现待上游）。子木适配面 = 唯一一处测试 mock caps 字面量迁移
# （channel_adapter.rs），其余（读字段 / qq()/wechat() 构造器 / BoundOnly
# trait 实现吃默认方法）零改动；rusqlite 维持 0.43 无连带。
# 0.5.1（2026-11-22）= 子木第七轮移交 R17 落地（IM 出站 Markdown 表格投影，
# 交接件 robit/docs/robit-rfc-im-table-projection.md，T1+T2+T3 全收，0.5.0 发版；
# 0.5.1 为维护版：rusqlite 0.42→0.43 上游 use-after-free 修复 + CI Node 24）。
# T1 表格线性化（render_table 空格对齐伪表格 → linearize_table：两列 `键: 值`
# 逐行、N 列 `首列 — 表头: 值 · …` 逐记录，比例字体/CJK 宽度问题整个消失，
# 输出无管道残留、二次投影幂等）+ T2 纯文本平台也过投影（flush_buffer 删除
# supports_markdown=false 跳过分支，微信输出与 caps 宣称一致；降级尊重
# features：字面 **/> /~~ 去除、链接保留 URL）+ T3 prepare_outbound 扩展为
# 「内容投影 + 长度守卫」统一出站准备（先投影后分段），直调路径透明获得投影。
# 纯文本快速通道：无 Markdown 触发字符的文本逐字节直通——预警/摘要 Clip 形态
# 与系统通知行为逐位不变。子木纯升版零适配：推送链显式清洗器调用保留（幂等），
# IM 表格展示缺口（R17）修复；rusqlite 连带 0.43（与 robit 公共 API 交换
# Connection/Error 类型须同线）。
# 0.4.1（2026-11-22）= 子木第六轮移交 R16 落地（出站长度守卫透明封装，交接件
# robit/docs/robit-rfc-outbound-length-guard.md，方案 A）：robit-chatbot 公开
# outbound 模块（prepare_outbound / MAX_OUTBOUND_SEGMENTS=3 / TRUNCATION_MARKER，
# 分段/截断规则单源化，flush_buffer 改调同一实现）+ robit-wechat send_text_inner
# 节流前透明分段（每段独立过 SendLimiter，部分失败放弃余段返回已发段 msg_id）
# + robit-qq send_message 截断守卫（编辑平台单条截断+省略号，不分段）。
# send_message trait 文档写明长度守卫契约（实现方按 caps 强制，调用方不自截）。
# 子木纯升版零适配：P7-T8 chat_push 透传链零 diff 获得长文分段；预警/摘要
# Clip 形态 ≤cap 幂等直通，行为逐位不变。
# 0.4.0（2026-11-20）= 子木第五轮移交 R14 落地（微信出站反刷限流，交接件
# robit/docs/robit-rfc-wechat-outbound-ratelimit.md，W1–W4 全收）：
# robit-chatbot 通用 throttle 模块（账号级预算：最小间隔+滑动窗口+冷却+快照
# 持久化，微信缺省启用）+ AgentError::RateLimited（-2 瞬态码类型化，
# #[non_exhaustive]）+ HintPolicy 进度提示策略（微信缺省 off）+
# send_message_best_effort + 无编辑平台长回复分段（不再静默截断）。
# v0.3.1 同批：Ctrl+C 优雅退出重做——ChatbotManager::run 与双 adapter connect
# 的 shutdown 参数 Arc<Notify> → CancellationToken（电平触发不丢信号）、退出前
# 等流式回复收尾最多 15s、robit-wechat login 可 Ctrl+C 取消。
# 子木适配面：channel.rs/qq_channel.rs/wechat_channel.rs 关停管线换
# CancellationToken；WechatConfig 字面构造补 rate_limit/progress_hint（测试）。
# 0.3.0（2026-11-17）= 微信 iLink Bot 渠道接入（ADR-0017，C4 关闭）：新 crate
# robit-wechat（微信官方 iLink AI Bot，协议 SDK weixin-agent 0.3；出站长轮询无需
# 公网回调，1:1 私聊，CLI 扫码换长期 bot_token）+ PlatformCaps::wechat() /
# MarkdownFeatures::wechat() + manager 附件契约（local_path 已设跳过通用下载）。
# 全 additive：PlatformAdapter trait / ChatbotManager::new 签名不变，robit-web
# 零 diff（wire 不变），存储 v7 零迁移，robit-agent/qq/web 源码零改动纯版本跟随，
# rusqlite 0.42 无连带——QQ 消费代码零适配。子木消费面：wechat_channel.rs 双
# manager 接线 + channel_push.rs caps 参数化推送（缺口批 R13 登记，零绕过）。
# 0.2.1（2026-11-14）= M1 收尾：附件标注行携带本地保存路径
# （describe_with_local，相对 working_dir 显示）——非图数据文件对模型从
# 「能发现、够不着」变为路径可见；内容读取仍需宿主注册收读工具（另案）。
# 纯 additive：无签名/字段/枚举变化，robit-web 零 diff，子木纯升版。
# 0.2.0（2026-11-14）= 子木第四轮移交全量落地（R10 附件批 M1–M7 + R8 宿主形态
# H1–H6，交接件 robit/docs/robit-rfc-qq-media-and-host-feedback.md）：附件本地
# 路径注入 + vision 本地优先三级兜底 / 标注恰一份 / 文件名消毒去重 / 20MB 缺省
# 上限 / media 保留策略 / inject_message 注入 API / source 参数化 / cleanup 实装
# + 僵尸自愈 / (source, namespace) 会话隔离 / memory 跟随 global_storage /
# custom_prompt 人格注入。robit-web 零 diff（wire 不变）。子木最小适配：
# Agent 两构造补 custom_prompt=None、MessageData 补 source=None、ToolContext
# 补 memory_dir、BoundOnly/MockPlatform 补 platform_name()；rusqlite 连带 0.42。
# 0.1.29（2026-11-08）= R9 chatbot 思考日志刷屏收口（子木 QQ 真机走查反馈）：
# robit-chatbot 对 ThinkingDelta 的每帧一条 trace 改为回合收口汇总一条
# （deltas/bytes 原子计数，TurnComplete/Error 时输出）；无 API/wire 变化。
# 0.1.28（2026-11-05）= 子木 R7 思考过程输出落地版：robit-ai 双路径捕获
# reasoning_content（模型级 thinking = auto|on|off）/ AgentEvent::ThinkingDelta /
# robit-web thinking_delta wire 帧；R6 空白 text_delta 帧在发射端收口（子木前端
# 守卫保留为惰性兼容）。穷举 match AgentEvent 的宿主（zimu-agent-cli）随版补臂。
# 0.1.27（2026-10-31）= R2–R5 宿主形态适配版，子木切换 R3+R4，R2/R5 有意不消费。
# 决策记录见 docs/07-backlog.md R 系列。
# 升级版本前先想 robit 那边的节奏，约定见 CLAUDE.md；开发期可临时改回
# git = "https://github.com/leexgone/robit", tag/rev = … 消费未发布改动。
[workspace.dependencies]
robit-ai = "0.6.0"
robit-agent = "0.6.0"
robit-web = "0.6.0"
# PR3/T5 QQ 通道（ADR-0011）：robit-chatbot 平台无关基座（ChatbotManager/PlatformAdapter）
# + robit-qq 平台 adapter（lib 面消费，二进制不复用）。
# rusqlite 0.43 对齐由 robit-agent 传递依赖保证（libsqlite3-sys links 单例）。
robit-chatbot = "0.6.0"
robit-qq = "0.6.0"
# P6-T2 微信通道（ADR-0017）：robit-wechat iLink Bot adapter（lib 面消费，
# 登录走部署侧 CLI `robit-wechat login`，bin 不复用）。
robit-wechat = "0.6.0"
# [zimu.channels] 通道开关解析（拍板⑥）：robit 类型化 Config 不认识子木自有节、
# 会静默忽略——子木侧对同一份 config.toml 做 raw 解析，两处读同一文件互不冲突。
toml = "1.2"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",     # mpsc / oneshot（Agent 通道）
    "io-std",   # stdin（REPL）
    "io-util",  # AsyncBufReadExt
    "time",     # 探测超时（P4-T4：status 端点有界降级；此前经 reqwest 间接启用，显式声明）
    "fs",       # 上传落盘（ADR-0015：chat_upload 流式写 media/；此前经 robit-agent 间接启用，显式声明）
] }
async-trait = "0.1"
# multipart：Web 对话框文件上传（ADR-0015，POST /api/chat 改 multipart/form-data）
axum = { version = "0.8", features = ["multipart"] }
tokio-stream = { version = "0.1", features = ["sync"] } # BroadcastStream（SSE 事件扇出）
# robit 0.4.0 起关停信号统一 CancellationToken（zimu-server 通道管线；版本与
# robit-agent 传递依赖对齐，zimu-agent 测试同款）
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] } # time = OffsetTime 本地时间计时器（控制台层与 robit 文件层同源）
# 控制台日志本地时间计时器的格式描述解析：与 robit-ai 的 time 同一 crate 实例
#（依赖图已有，零新增编译单元）；本地偏移判定走 robit_ai::local_utc_offset()。
time = { version = "0.3", features = ["formatting", "parsing"] }
anyhow = "1.0"
# P4-T2 存储：bundled 自带 SQLite 编译，不依赖系统库。
# 版本必须与 robit-agent 的 rusqlite 对齐（0.43，随 robit 0.5.1 从 0.42 升——
# 上游 use-after-free 修复；与 robit 公共 API 交换 Connection/Error 类型须同线）：
# libsqlite3-sys 的 links 约束全依赖图只允许一份 libsqlite3，不同主版本会直接解析冲突。
rusqlite = { version = "0.43", features = ["bundled"] }
# P4-T4 行情适配器：版本与特性跟 robit 侧的 reqwest 对齐（0.13，default-features
# 关）——同一份已编译依赖，不引入 native-tls 等新增重量。0.13 起 query() 在
# 独立 feature 里（serde_urlencoded，robit 已启用，零新增编译单元）。
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
# P4-T4 市场时钟：只用固定偏移（Asia/Shanghai = UTC+8，03 §9 生产口径），
# 不引时区数据库；clock 特性提供 Utc::now。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# P4-T5 契约同源：serde 结构体在定义处 derive ToSchema，编译期生成 OpenAPI 3.1
# 文档（docs/api/openapi.json 由测试保证与代码一致）；前端类型自该文档生成。
utoipa = "6.0"
# P4-T5 契约测试（仅 zimu-server dev-dep）：实时响应与样例过 schema 校验。
jsonschema = "0.62"
# ADR-0015 上传落盘：文件名消毒空名兜底 + 防覆盖 100 次后兜底（复刻 robit media.rs
# 私有规则，R12 已诉求上游公开）；与 robit-agent 内部 uuid 同 crate 实例。
uuid = { version = "1.29", features = ["v4"] }
