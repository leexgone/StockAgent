[package]
name = "zimu-agent"
description = "子木 · agent 应用层（P4-T6）：robit 领域工具（行情/持仓/纪律/试算/打分/留档）+ Skill 模板加载 + 与 HTTP API 共用的应用服务（行情刷新链）。数字口径只在 zimu-domain，本 crate 只做接线"
version.workspace = true
edition.workspace = true

[dependencies]
zimu-domain = { path = "../zimu-domain" }
zimu-store = { path = "../zimu-store" }
zimu-market = { path = "../zimu-market" }
robit-agent.workspace = true
# T1 唯一装配线：LlmClient/RobitConfig/ContextConfig 在 robit-ai（与 server 同款版本，0.2.1）
robit-ai.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
# 刷新链响应类型带 ToSchema（server 契约复用，openapi.json 组件名不变）
utoipa.workspace = true
# kline 窗口起点（今天 − 90 天）与留档时间戳格式化
chrono.workspace = true
# ADR-0014：装配补 robit 自持会话库 init_db（search_history 三端可用）——
# Connection 类型须与 robit-agent 同一 crate 实例（workspace 0.42 对齐）
rusqlite.workspace = true

[dev-dependencies]
# 集成测试构造 ToolContext 需要 CancellationToken（版本与 robit-agent 对齐）
tokio-util = "0.7"
