[package]
name = "zimu-server"
description = "子木 · 股票智能助理 Web 服务（health + 静态托管 + Agent SSE 会话 + 持仓录入 API）"
version.workspace = true
edition.workspace = true

[dependencies]
zimu-store = { path = "../zimu-store" }
zimu-domain = { path = "../zimu-domain" }
zimu-market = { path = "../zimu-market" }
# P4-T6：agent 领域工具 + Skill 加载 + 刷新链应用服务（bin 装配 Agent，lib 复用 service 类型）
zimu-agent = { path = "../zimu-agent" }
robit-ai.workspace = true
robit-agent.workspace = true
robit-web.workspace = true
# T5 QQ 通道：ChatbotManager<QqPlatformAdapter> + BoundOnly decorator（lib 侧）
robit-chatbot.workspace = true
robit-qq.workspace = true
# P6-T2 微信通道（ADR-0017）：ChatbotManager<BoundOnly<WechatPlatformAdapter>> 双 manager
robit-wechat.workspace = true
# T5 通道开关：raw 解析 [zimu.channels]（robit 类型化面看不见自有节）
toml.workspace = true
tokio.workspace = true
# robit 0.4.0 关停信号：CancellationToken（通道管线 + manager.run/adapter.connect）
tokio-util.workspace = true
tokio-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
anyhow.workspace = true
utoipa.workspace = true # openapi.rs：ApiDoc 汇编 + 响应结构体 ToSchema（P4-T5）
uuid.workspace = true # ADR-0015 chat_upload：消毒空名/防覆盖兜底

[dev-dependencies]
# 集成测试（tests/market_api.rs）：真实 HTTP 打本机回环临时端口 + 日期构造
# multipart：上传集成测试（tests/chat_upload.rs）构造 multipart 请求体（ADR-0015）
reqwest = { workspace = true, features = ["multipart"] }
chrono.workspace = true
# 契约测试（tests/contract.rs）：实时响应与 fixtures/api 样例过 OpenAPI schema 校验
jsonschema.workspace = true
