# ── 子木容器配置模板（ADR-0018 D8）─────────────────────────────────
# entrypoint 首跑播种到 /data/.robit/config.toml（永不覆盖已有文件）。
# 凭据纪律：只允许整串 ${VAR} 占位、永不写密钥字面量；真实值经 compose 根 .env
# （env_file）注入容器 env 展开消费。勿在卷内 .robit/ 放 .env（robit 加载会
# 无条件覆盖容器 env，docs/08 §2）。
# 通道开关缺省停用 fail-closed（ADR-0011 拍板⑥）：填好凭据后翻 true 并重启。
default_model = "qwen/qwen3.7-plus"
default_image_model = "wanxiang/wan2.7-image-pro"

[providers.qwen]
name = "通义千问"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "${DASHSCOPE_API_KEY}"

[[providers.qwen.models]]
id = "qwen3.7-plus"
thinking = "on" # 思考过程输出（R7）；不需要可改 "auto"
name = "Qwen 3.7 Plus"
context_window = 1000000
max_output_tokens = 8192
supports_images = true
supports_tools = true

[[providers.qwen.models]]
id = "qwen-max"
name = "Qwen Max"
context_window = 32768
max_output_tokens = 8192
supports_images = true
supports_tools = true

[[providers.qwen.models]]
id = "qwen-plus"
name = "Qwen Plus"
context_window = 131072
max_output_tokens = 8192
supports_images = true
supports_tools = true

[image_providers.wanxiang] # 万相（DashScope 协议）；base_url 可换自有网关/套餐端点
name = "通义万相"
base_url = "https://dashscope.aliyuncs.com/api/v1"
api_key = "${BAILIAN_API_KEY}"
protocol = "dashscope" # dashscope | openai
mode = "async" # sync | async（仅 dashscope 有效）
poll_interval_secs = 3
poll_timeout_secs = 300

[[image_providers.wanxiang.models]]
id = "wan2.7-image-pro"
name = "万相2.7 Pro"

[[image_providers.wanxiang.models]]
id = "wan2.7-image"
name = "万相2.7"

[channels.qq_bot]
app_id = "${ZIMU_QQ_APP_ID}"
app_secret = "${ZIMU_QQ_APP_SECRET}"

# 微信无配置节：bot_token 由扫码登录落 .robit/wechat-state.json
# （docker compose run --rm -it --no-deps zimu robit-wechat login，docs/08 §3）。

# ── 子木自有节：通道启用开关（robit 类型化解析忽略本节，两边读同一文件互不冲突）──
[zimu.channels]
qq = false
wechat = false

[app]
# ADR-0014 拍板：确认关闭、自动执行（工具无沙箱，人格纪律 + 绑定白名单 + 域校验
# 是防线）。重开确认 = 翻 false + 先补 docs/07 C13 两洞。
auto_approve = true
# 通道库隔离前提（ADR-0011）：true 会把 robit 会话库指到 ~/.robit/memory/ 撞库——保持 false。
global_storage = false
max_steps = 20
log_level = "info"
log_file = true

# ── 计划任务（robit 0.7.0 M1，ADR-0022 启用，仅 IM 通道生效）──
# ChatbotManager 官方接线：enabled=true 即自启停调度器、逐会话挂上下文，宿主零代码。
# 微信/QQ 绑定会话可自然语言创建提醒/周期任务 + /schedule 直管；Web/CLI 工具注册
# 但无调度上下文，调用如实报不可用（robit 0.8.0 的 M2 Web 接线件不消费，ADR-0022 补记）。任务触发 = 无人值守自主回合，
# auto_approve=true 下创建/编辑直接执行（信任边界明示于 ADR-0022：绑定白名单 +
# 人格纪律承接，自主回合不扩张授权）。其余字段吃 robit 缺省：
#   missed_policy = "latest"   停机补触发：重启后每任务补最近一次 missed，不风暴
#   min_interval_secs = 60     interval/cron 最小触发间隔
#   max_active_tasks = 50      每归属（source,namespace,chat_id）活跃任务上限
#   delivery_retries = 3       投递失败退避重试 5s/30s/120s，终败留痕任务仍 active
# 停用 = enabled = false 重启即全关（工具不注册、调度器不启）。
# 注意：既有卷 config 永不覆盖——升级后启用须手工补本节再重启（docs/08 §6）。
[app.schedule]
enabled = true

# ── LLM 超时/重试（robit 0.8.0 起真正生效；缺节 = 文档默认，无需配置）──
# 挂起请求防护三层：传输层 reqwest 固定超时（connect 10s / read 90s / keepalive 30s）、
# 调用层首包 60s + SSE chunk 90s 空闲守卫（转 LlmError::Timeout，释放卡死循环）——
# 这两层不吃本配置；本节只管瞬时错误（超时/连接失败/5xx/408/429）的退避重试。
# 已流式输出后不再重试（避免重复文本）。IM 通道由 ChatbotManager 自动读取，
# Web 桥/CLI 经 AgentCore::retry_settings() 接线——三处同节生效。
# [app.retry]
# max_retries = 3            # 首试之外的重试次数（默认 3 → 至多 4 次尝试）
# initial_backoff_ms = 1000  # 首次退避（指数翻倍）
# max_backoff_ms = 30000     # 退避封顶